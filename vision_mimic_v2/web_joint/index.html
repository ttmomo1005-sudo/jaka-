<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JAKA π 派仔 · 网页驱动仿真</title>
  <style>
    :root {
      --bg: #0e141b; --panel: #172029; --line: #2c3a48; --text: #e8eef4;
      --muted: #8b9aab; --accent: #3ecf8e; --warn: #e6b450; --blue: #2f6fed; --bad: #f07178;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
    #app { display: grid; grid-template-columns: 1fr 380px; height: 100%; }
    #view { position: relative; background: radial-gradient(1000px 560px at 50% 15%, #1b2834, #090d12); }
    #c { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute; left: 14px; top: 12px; z-index: 2;
      background: rgba(15,22,30,.86); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; max-width: min(520px, 78vw);
      font-size: 13px; line-height: 1.45; color: var(--muted);
    }
    #hud b { color: var(--accent); }
    #status { color: var(--warn); }
    #status.err { color: var(--bad); }
    #status.ok { color: var(--accent); }
    #sync { margin-top: 4px; }
    #balance {
      margin-top: 8px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: rgba(36,49,64,.9);
      font-size: 12px; line-height: 1.4;
    }
    #balance.ok { border-color: #2a6b4a; color: var(--accent); }
    #balance.warn { border-color: #8a6a20; color: var(--warn); background: rgba(90,60,10,.35); }
    #balance.danger {
      border-color: #a33; color: #ffb4b8; background: rgba(90,20,20,.45);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(240,113,120,.0); }
      50% { box-shadow: 0 0 0 4px rgba(240,113,120,.25); }
    }
    #balance .title { font-weight: 600; margin-bottom: 2px; }
    #balance .sub { color: var(--muted); font-size: 11px; }
    aside {
      border-left: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0;
    }
    aside header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    aside header h1 { margin: 0; font-size: 15px; }
    aside header p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    #jointList { flex: 1; overflow: auto; padding: 8px 10px 16px; }
    .group { margin-top: 10px; }
    .group h3 { margin: 0 0 6px; font-size: 12px; color: var(--warn); }
    .row {
      display: grid; grid-template-columns: 72px 34px 1fr 34px 44px;
      gap: 4px; align-items: center; margin: 5px 0; font-size: 11px;
    }
    .row label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .lim {
      font-variant-numeric: tabular-nums; color: #6d7d8f; text-align: center; font-size: 10px;
    }
    .row input[type=range] { width: 100%; accent-color: var(--blue); }
    .row input[type=range]:disabled { opacity: 0.45; }
    .row .val { font-variant-numeric: tabular-nums; text-align: right; color: var(--accent); }
    .row.at-limit .val { color: var(--bad); font-weight: 600; }
    .row.at-limit input[type=range] { accent-color: var(--bad); }
    .modeBox {
      margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
      background: #13202c;
    }
    .modeBox .lab { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .modeBox .btns { display: flex; gap: 6px; }
    .modeBox button {
      flex: 1; border: 1px solid var(--line); background: #243140; color: var(--text);
      border-radius: 8px; padding: 8px 6px; cursor: pointer; font: inherit; font-size: 12px;
    }
    .modeBox button.on { background: var(--blue); border-color: var(--blue); }
    .modeBox button.warn.on { background: #a86b18; border-color: #a86b18; }
    .modeHint { margin-top: 6px; font-size: 11px; color: var(--warn); line-height: 1.35; }
    .ops { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
    button {
      flex: 1; border: 1px solid var(--line); background: #243140; color: var(--text);
      border-radius: 8px; padding: 9px 10px; cursor: pointer; font: inherit;
    }
    button.primary { background: var(--blue); border-color: var(--blue); }
    #sel {
      position: absolute; left: 14px; bottom: 14px; z-index: 2;
      background: rgba(15,22,30,.9); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; min-width: 240px;
    }
    @media (max-width: 900px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 58vh 42vh; }
      aside { border-left: none; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="view">
      <canvas id="c"></canvas>
      <div id="hud">
        <div><b>JAKA π（派仔）</b> · 官方 URDF/STL，与 MuJoCo 同一套 mesh</div>
        <div>左键旋转 · 滚轮缩放 · 右键平移 · 拖橙色球或右侧滑条</div>
        <div id="status">正在加载派仔真实模型…</div>
        <div id="sync">仿真同步：检测中…</div>
        <div id="balance" class="ok">
          <div class="title">平衡：检测中…</div>
          <div class="sub">质心相对双足支撑面（站立粗检，供模仿动作预警）</div>
        </div>
      </div>
      <div id="sel">选中关节：—</div>
    </div>
    <aside>
      <header>
        <h1>27 关节控制</h1>
        <p>硬限位 · 失衡提醒 · 下方可切换跟随范围</p>
        <div class="modeBox">
          <div class="lab">仿真跟随模式（有意设计，不是 bug）</div>
          <div class="btns">
            <button type="button" id="modeUpper" class="on">仅上半身</button>
            <button type="button" id="modeFull" class="warn">全身跟随</button>
          </div>
          <div class="modeHint" id="modeHint">默认：腿+腰由 loco 策略保平衡；网页控手臂/颈。</div>
        </div>
      </header>
      <div id="jointList"></div>
      <div class="ops">
        <button id="btnReset">复位站姿</button>
        <button class="primary" id="btnZero">全部归零</button>
      </div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
  <script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { STLLoader } from "three/addons/loaders/STLLoader.js";
  import URDFLoader from "/vendor/URDFLoader.module.js";

  const NAMES = [
    "Left_hip_pitch_joint","Left_hip_roll_joint","Left_hip_yaw_joint","Left_knee_joint","Left_ankle_pitch_joint","Left_ankle_roll_joint",
    "Left_shoulder_pitch_joint","Left_shoulder_roll_joint","Left_shoulder_yaw_joint","Left_elbow_joint","Left_wrist_roll_joint","Left_wrist_yaw_joint",
    "Right_hip_pitch_joint","Right_hip_roll_joint","Right_hip_yaw_joint","Right_knee_joint","Right_ankle_pitch_joint","Right_ankle_roll_joint",
    "Right_shoulder_pitch_joint","Right_shoulder_roll_joint","Right_shoulder_yaw_joint","Right_elbow_joint","Right_wrist_roll_joint","Right_wrist_yaw_joint",
    "waist_yaw_joint","Neck_yaw_joint","Neck_pitch_joint"
  ];
  const LABELS = [
    "左髋俯仰","左髋侧摆","左髋旋转","左膝","左踝俯仰","左踝侧摆",
    "左肩俯仰","左肩侧摆","左肩旋转","左肘","左腕滚转","左腕偏转",
    "右髋俯仰","右髋侧摆","右髋旋转","右膝","右踝俯仰","右踝侧摆",
    "右肩俯仰","右肩侧摆","右肩旋转","右肘","右腕滚转","右腕偏转",
    "腰偏航","颈偏航","颈俯仰"
  ];
  // 官方 Khan_mini.xml 物理硬限位（与仿真关节 range 一致）
  let DOWN = [-1.9198,-0.5236,-2.0071,-0.349,-0.5236,-0.349,-1.5707,-1.9189,-1.5707,-0.8726,-1.5707,0,-1.9198,-0.5236,-2.0071,-0.349,-0.5236,-0.349,-1.5707,-1.9189,-1.5707,-0.8726,-1.5707,0,-2.0071,-1.5707,-0.6108];
  let UP   = [1.2217,2.3562,3.5779,2.2689,0.6108,0.349,1.5707,1.9189,1.5707,2.2689,1.5707,1.5707,1.2217,2.3562,3.5779,2.2689,0.6108,0.349,1.5707,1.9189,1.5707,2.2689,1.5707,1.5707,3.5779,1.5707,0.6108];
  const INIT = [0,0,0,0,0,0, 0,-1.57,0,1.57,0,0.3, 0,0,0,0,0,0, 0,-1.57,0,1.57,0,0.3, 0,0,0];
  const GROUPS = [
    { title: "左腿", ids: [0,1,2,3,4,5] },
    { title: "左臂", ids: [6,7,8,9,10,11] },
    { title: "右腿", ids: [12,13,14,15,16,17] },
    { title: "右臂", ids: [18,19,20,21,22,23] },
    { title: "腰颈", ids: [24,25,26] },
  ];

  const q = INIT.map((v, i) => Math.max(DOWN[i], Math.min(UP[i], v)));
  const clip = (i, v) => {
    const x = Number(v);
    if (!Number.isFinite(x)) return q[i];
    return Math.max(DOWN[i], Math.min(UP[i], x));
  };
  const atLimit = (i, v = q[i]) => v <= DOWN[i] + 1e-6 || v >= UP[i] - 1e-6;
  const fmtDeg = (rad) => (rad * 180 / Math.PI).toFixed(0);
  const statusEl = document.getElementById("status");
  const syncEl = document.getElementById("sync");
  const balEl = document.getElementById("balance");
  const selEl = document.getElementById("sel");
  const setStatus = (t, cls="") => { statusEl.textContent = t; statusEl.className = cls; };

  function showBalance(bal) {
    if (!bal) return;
    const level = bal.level || (bal.ok ? "ok" : "danger");
    balEl.className = level;
    const margin = (typeof bal.margin_m === "number")
      ? `裕度 ${(bal.margin_m * 100).toFixed(1)} cm` : "";
    const reasons = (bal.reasons || []).slice(0, 2).join("；");
    const titleMap = {
      ok: "平衡：正常",
      warn: "平衡警告：动作可能导致不稳",
      danger: "不平衡：该姿态站立会失衡",
    };
    balEl.innerHTML = `<div class="title">${titleMap[level] || "平衡"} — ${bal.message || ""}</div>
      <div class="sub">${margin}${margin && reasons ? " · " : ""}${reasons || "质心相对双足支撑面粗检"}</div>`;
  }

  let pushTimer = null;
  function pushPose(immediate=false) {
    const send = () => {
      // 本地先裁剪，服务端再硬裁剪一次
      for (let i = 0; i < 27; i++) q[i] = clip(i, q[i]);
      fetch("/api/pose", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q }),
      }).then(r => r.json()).then((res) => {
        if (res.q && Array.isArray(res.q) && res.q.length === 27) {
          let changed = false;
          for (let i = 0; i < 27; i++) {
            if (Math.abs(q[i] - res.q[i]) > 1e-6) { q[i] = res.q[i]; changed = true; }
          }
          if (changed) { syncSliders(); applyPose(); }
        }
        if (res.balance) showBalance(res.balance);
      }).catch(() => {});
    };
    if (immediate) { send(); return; }
    if (pushTimer) return;
    pushTimer = setTimeout(() => { pushTimer = null; send(); }, 50);
  }

  let controlMode = "upper";
  const modeUpperBtn = document.getElementById("modeUpper");
  const modeFullBtn = document.getElementById("modeFull");
  const modeHint = document.getElementById("modeHint");

  function paintMode(mode) {
    controlMode = mode === "full" ? "full" : "upper";
    modeUpperBtn.classList.toggle("on", controlMode === "upper");
    modeFullBtn.classList.toggle("on", controlMode === "full");
    modeHint.textContent = controlMode === "upper"
      ? "仅上半身：腿+腰由 loco 策略保平衡；网页控手臂/颈。"
      : "全身跟随：27 轴都跟网页（更容易摔倒，会自动复位）。";
  }

  async function setMode(mode) {
    paintMode(mode);
    try {
      const r = await fetch("/api/mode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ control_mode: mode }),
      });
      const s = await r.json();
      if (s.control_mode) paintMode(s.control_mode);
    } catch (_) {}
  }
  modeUpperBtn.onclick = () => setMode("upper");
  modeFullBtn.onclick = () => setMode("full");

  async function pollSync() {
    try {
      const r = await fetch("/api/status");
      const s = await r.json();
      const modeTxt = (s.control_mode === "full") ? "全身跟随" : "仅上半身";
      const map = {
        starting: "仿真同步：MuJoCo 启动中…",
        running: `仿真同步：已连接 · 模式=${modeTxt} · loco站立平衡`,
        offline: "仿真同步：MuJoCo 未运行（网页仍可预览）",
        error: "仿真同步失败：" + (s.detail || "error"),
      };
      syncEl.textContent = map[s.mujoco] || ("仿真同步：" + s.mujoco);
      syncEl.style.color = s.mujoco === "running" ? "var(--accent)"
        : (s.mujoco === "error" ? "var(--bad)" : "var(--warn)");
      if (s.balance) showBalance(s.balance);
      if (s.control_mode) paintMode(s.control_mode);
    } catch (_) {
      syncEl.textContent = "仿真同步：无法连接本地服务";
      syncEl.style.color = "var(--bad)";
    }
  }
  setInterval(pollSync, 1500);
  pollSync();
  fetch("/api/mode").then(r => r.json()).then(s => {
    if (s.control_mode) paintMode(s.control_mode);
  }).catch(() => {});

  // 从服务端拉取官方物理限位，覆盖前端默认值
  fetch("/api/limits").then(r => r.json()).then((lim) => {
    if (!lim || !lim.down || !lim.up || lim.down.length !== 27) return;
    DOWN = lim.down.map(Number);
    UP = lim.up.map(Number);
    for (let i = 0; i < 27; i++) q[i] = clip(i, q[i]);
    if (typeof syncSliders === "function") syncSliders();
  }).catch(() => {});

  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 40);
  camera.position.set(1.6, 1.2, 1.9);

  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0.7, 0);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x1a2430, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 1.25);
  key.position.set(2.5, 4, 2); scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aacc, 0.5);
  fill.position.set(-2, 2, -1); scene.add(fill);
  scene.add(new THREE.GridHelper(4, 20, 0x3a5166, 0x243444));

  let robot = null;
  const jointHandles = [];
  const matJoint = new THREE.MeshStandardMaterial({ color: 0xe6b450, metalness: 0.25, roughness: 0.4 });
  const matJointSel = new THREE.MeshStandardMaterial({ color: 0x3ecf8e, emissive: 0x145a36, metalness: 0.2, roughness: 0.35 });
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xe5eaef, metalness: 0.35, roughness: 0.48,
  });

  function applyPose() {
    if (!robot) return;
    for (let i = 0; i < 27; i++) {
      q[i] = clip(i, q[i]);
      const name = NAMES[i];
      const j = robot.joints && robot.joints[name];
      if (!j) continue;
      try {
        // 同步 URDF 关节硬限位，防止 setJointValue 越界
        if (j.limit) {
          j.limit.lower = DOWN[i];
          j.limit.upper = UP[i];
        }
        robot.setJointValue(name, q[i]);
      } catch (_) {}
    }
  }

  function highlight(id) {
    for (const h of jointHandles) {
      h.mesh.material = (h.id === id) ? matJointSel : matJoint;
    }
    const deg = (q[id] * 180 / Math.PI).toFixed(1);
    const limTip = atLimit(id) ? ' <span style="color:var(--bad)">已到限位</span>' : "";
    selEl.innerHTML = `<b>${LABELS[id]}</b>${limTip}<br/><span style="color:#8b9aab">${NAMES[id]}</span><br/>
      ${q[id].toFixed(3)} rad (${deg}°) · 硬限位 [${fmtDeg(DOWN[id])}°, ${fmtDeg(UP[id])}°]`;
  }

  const list = document.getElementById("jointList");
  const sliders = {};

  function refreshRow(id) {
    const s = sliders[id];
    if (!s) return;
    s.input.min = String(DOWN[id]);
    s.input.max = String(UP[id]);
    s.input.value = String(q[id]);
    s.val.textContent = q[id].toFixed(2);
    s.row.classList.toggle("at-limit", atLimit(id));
    s.lo.textContent = fmtDeg(DOWN[id]);
    s.hi.textContent = fmtDeg(UP[id]);
  }

  /** 唯一写关节入口：强制裁剪到官方限位 */
  function setJoint(id, value, { syncUi = true, push = true, sel = true } = {}) {
    q[id] = clip(id, value);
    if (syncUi) refreshRow(id);
    applyPose();
    if (sel) highlight(id);
    if (push) pushPose();
  }

  for (const g of GROUPS) {
    const box = document.createElement("div"); box.className = "group";
    box.innerHTML = `<h3>${g.title}</h3>`;
    for (const id of g.ids) {
      const row = document.createElement("div"); row.className = "row";
      const tip = `${NAMES[id]}  限位 ${DOWN[id].toFixed(2)} ~ ${UP[id].toFixed(2)} rad  (${fmtDeg(DOWN[id])}° ~ ${fmtDeg(UP[id])}°)`;
      row.title = tip;
      row.innerHTML = `<label>${LABELS[id]}</label>
        <span class="lim lo">${fmtDeg(DOWN[id])}</span>
        <input type="range" min="${DOWN[id]}" max="${UP[id]}" step="0.01" value="${q[id]}" />
        <span class="lim hi">${fmtDeg(UP[id])}</span>
        <span class="val">${q[id].toFixed(2)}</span>`;
      const input = row.querySelector("input");
      const val = row.querySelector(".val");
      const lo = row.querySelector(".lo");
      const hi = row.querySelector(".hi");
      // 浏览器原生硬挡：滑条物理上不能超出 min/max
      input.min = String(DOWN[id]);
      input.max = String(UP[id]);
      sliders[id] = { input, val, row, lo, hi };
      input.addEventListener("input", () => {
        // 再裁一次，防止异常输入 / 浏览器差异
        const raw = parseFloat(input.value);
        const clipped = clip(id, raw);
        if (clipped !== raw) input.value = String(clipped);
        setJoint(id, clipped, { syncUi: true, push: true, sel: true });
      });
      input.addEventListener("change", () => setJoint(id, input.value));
      input.addEventListener("pointerdown", () => highlight(id));
      box.appendChild(row);
      refreshRow(id);
    }
    list.appendChild(box);
  }
  function syncSliders() {
    for (let i = 0; i < 27; i++) refreshRow(i);
  }
  document.getElementById("btnReset").onclick = () => {
    for (let i = 0; i < 27; i++) q[i] = clip(i, INIT[i]);
    syncSliders(); applyPose(); pushPose(true);
  };
  document.getElementById("btnZero").onclick = () => {
    for (let i = 0; i < 27; i++) q[i] = clip(i, 0);
    syncSliders(); applyPose(); pushPose(true);
  };

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let dragging = null;
  function setPointer(e) {
    const r = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || !jointHandles.length) return;
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(jointHandles.map(h => h.mesh), false);
    if (!hits.length) return;
    const id = hits[0].object.userData.jointId;
    dragging = { id, y0: e.clientY, q0: q[id] };
    controls.enabled = false;
    highlight(id);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const span = Math.max(1e-6, UP[dragging.id] - DOWN[dragging.id]);
    const sens = span / 280;
    setJoint(dragging.id, dragging.q0 + (dragging.y0 - e.clientY) * sens);
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = null;
    controls.enabled = true;
    pushPose(true);
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  {
    const manager = new THREE.LoadingManager();
    const urdfLoader = new URDFLoader(manager);
    urdfLoader.packages = "";
    urdfLoader.workingPath = "/";
    urdfLoader.loadMeshCb = (path, mgr, done) => {
      let url = path;
      if (!url.startsWith("http") && !url.startsWith("/")) url = "/" + url.replace(/^\.\//, "");
      // 官方路径可能是 ../meshes/xxx.STL
      url = url.replace(/\/\.\.\//g, "/").replace(/\/+/g, "/");
      if (url.includes("meshes/") && !url.startsWith("/meshes/")) {
        url = "/meshes/" + url.split("meshes/").pop();
      }
      new STLLoader(mgr).load(
        url,
        (geom) => {
          geom.computeVertexNormals();
          const mesh = new THREE.Mesh(geom, bodyMat.clone());
          done(mesh);
        },
        undefined,
        (err) => {
          console.warn("STL fail", url, err);
          done(null, err);
        }
      );
    };

    setStatus("正在加载派仔 URDF + STL…");
    urdfLoader.load(
      "/robot.urdf?" + Date.now(),
      (result) => {
        robot = result;
        robot.rotation.x = -Math.PI / 2;
        robot.updateMatrixWorld(true);
        scene.add(robot);

        for (let i = 0; i < 27; i++) {
          const j = robot.joints[NAMES[i]];
          if (!j) continue;
          const ball = new THREE.Mesh(new THREE.SphereGeometry(0.028, 14, 12), matJoint);
          ball.userData.jointId = i;
          j.add(ball);
          jointHandles.push({ id: i, mesh: ball });
        }

        applyPose();
        pushPose(true);

        const box = new THREE.Box3().setFromObject(robot);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);
        camera.position.set(center.x + Math.max(0.8, size.x) * 1.8, center.y + size.y * 0.55, center.z + Math.max(0.8, size.z) * 2.0);
        setStatus(`派仔真实模型已加载（官方 STL）· 可控 ${jointHandles.length}/27`, "ok");
      },
      undefined,
      (err) => {
        console.error(err);
        setStatus("模型加载失败：请用 05_web_joint_preview.cmd 启动", "err");
      }
    );
  }

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(1, r.height);
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  (function tick() {
    requestAnimationFrame(tick);
    controls.update();
    renderer.render(scene, camera);
  })();
  </script>
</body>
</html>
